name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب جاوا (لازم برای ساخت اندروید)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: نصب Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: ساخت پوشه‌ی پلتفرم اندروید (android/) در صورت نبودن
        run: flutter create --platforms=android --project-name tic3_smart .

      - name: به‌روزرسانی نسخه‌ی Kotlin Gradle Plugin (رفع ناسازگاری با پکیج‌ها)
        run: sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle

      - name: افزودن مجوز دوربین (برای اسکن QR)
        run: sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

      - name: افزودن مجوزهای بلوتوث/وای‌فای/مکان (برای بازی نزدیک)
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />' android/app/src/main/AndroidManifest.xml

      - name: فعال‌سازی کوچک‌سازی کد (R8) برای کاهش بیشتر حجم
        run: sed -i '/signingConfig = signingConfigs.debug/a\            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")' android/app/build.gradle

      - name: نصب پکیج‌های پروژه
        run: flutter pub get

      - name: ساخت APK نهایی (release) - جدا برای هر معماری برای کاهش حجم
        run: flutter build apk --release --split-per-abi

      - name: آپلود فایل‌های APK به‌عنوان خروجی این اجرا
        uses: actions/upload-artifact@v4
        with:
          name: tic3-smart-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
