name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب جاوا (لازم برای ساخت اندروید)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: نصب Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: ساخت پوشه‌ی پلتفرم اندروید (android/) در صورت نبودن
        run: flutter create --platforms=android --project-name tic3_smart .

      - name: به‌روزرسانی نسخه‌ی Kotlin Gradle Plugin (رفع ناسازگاری با پکیج‌ها)
        run: sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle

      - name: افزودن پلاگین Google Services (برای اتصال به فایربیس)
        run: |
          sed -i '/id "org.jetbrains.kotlin.android" version/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          sed -i '/id "org.jetbrains.kotlin.android"$/a\    id "com.google.gms.google-services"' android/app/build.gradle

      - name: افزودن مجوز دوربین (برای اسکن QR)
        run: sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

      - name: نصب پکیج‌های پروژه
        run: flutter pub get

      - name: ساخت APK نهایی (release) - جدا برای هر معماری برای کاهش حجم
        run: flutter build apk --release --split-per-abi

      - name: آپلود فایل‌های APK به‌عنوان خروجی این اجرا
        uses: actions/upload-artifact@v4
        with:
          name: tic3-smart-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
