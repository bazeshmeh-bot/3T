name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب جاوا (لازم برای ساخت اندروید)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: نصب Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: ساخت پوشه‌ی پلتفرم اندروید (android/) در صورت نبودن
        run: flutter create --platforms=android --project-name tic3_smart .

      - name: به‌روزرسانی نسخه‌ی Kotlin Gradle Plugin (رفع ناسازگاری با پکیج‌ها)
        run: sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle

      - name: نصب پکیج‌های پروژه
        run: flutter pub get

      - name: ساخت APK نهایی (release)
        run: flutter build apk --release

      - name: آپلود فایل APK به‌عنوان خروجی این اجرا
        uses: actions/upload-artifact@v4
        with:
          name: tic3-smart-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
