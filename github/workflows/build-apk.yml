name: Build APK

# هر بار که کد به شاخه‌ی main پوش (push) بشه، یا دستی از تب Actions اجرا بشه،
# این workflow به‌صورت خودکار فایل APK می‌سازه.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions در گیت‌هاب

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب جاوا (لازم برای ساخت اندروید)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: نصب Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: نصب پکیج‌های پروژه
        run: flutter pub get

      - name: ساخت APK نهایی (release)
        run: flutter build apk --release

      - name: آپلود فایل APK به‌عنوان خروجی این اجرا
        uses: actions/upload-artifact@v4
        with:
          name: tic3-smart-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
